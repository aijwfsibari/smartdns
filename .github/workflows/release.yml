name: Build SmartDNS OpenWrt MT7621 APK with UI + LuCI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # ============================================================
  # OpenWrt Target
  # ============================================================
  OPENWRT_VERSION: "25.12.5"
  OPENWRT_TARGET: "ramips"
  OPENWRT_SUBTARGET: "mt7621"
  OPENWRT_ARCH: "mipsel_24kc"

  # Rust target
  RUST_TARGET: "mipsel-unknown-linux-musl"

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "SmartDNS source version"
        required: true
        default: "nightly"
        type: choice
        options:
          - nightly
          - stable

permissions:
  contents: read

jobs:
  build:
    name: Build SmartDNS for OpenWrt 25.12.5 ramips/mt7621
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Select Nightly / Stable
      # ============================================================
      - name: Select SmartDNS Version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TYPE="${{ inputs.build_type }}"

          echo "=========================================="
          echo "Requested build type: $BUILD_TYPE"
          echo "=========================================="

          if [ "$BUILD_TYPE" = "stable" ]; then

            if git remote get-url upstream >/dev/null 2>&1; then
              git remote set-url upstream \
                https://github.com/pymumu/smartdns.git
            else
              git remote add upstream \
                https://github.com/pymumu/smartdns.git
            fi

            echo
            echo "Fetching official SmartDNS tags..."

            git fetch \
              --force \
              --tags \
              upstream

            LATEST_RELEASE="$(
              git tag -l 'Release*' \
                | grep -E '^Release[0-9]+([.][0-9]+)*$' \
                | sort -V \
                | tail -n 1 \
                || true
            )"

            if [ -z "$LATEST_RELEASE" ]; then
              echo "ERROR: No official Release tag found."
              exit 1
            fi

            echo "Latest stable release: $LATEST_RELEASE"

            git checkout --force "$LATEST_RELEASE"

            BUILD_LABEL="$LATEST_RELEASE"
            SOURCE_REF="$LATEST_RELEASE"
            SOURCE_DESCRIPTION="Official Stable Release $LATEST_RELEASE"

          elif [ "$BUILD_TYPE" = "nightly" ]; then

            BUILD_LABEL="nightly"
            SOURCE_REF="$(git rev-parse --abbrev-ref HEAD)"
            SOURCE_DESCRIPTION="Nightly build from current fork"

          else

            echo "ERROR: Unknown build type: $BUILD_TYPE"
            exit 1

          fi

          PACKAGE_VERSION="$(date +"1.%Y.%m.%d-%H%M")"

          GIT_COMMIT="$(git rev-parse --short=7 HEAD)"
          GIT_COMMIT_FULL="$(git rev-parse HEAD)"

          echo
          echo "=========================================="
          echo "Selected source"
          echo "=========================================="
          echo "Build Type      : $BUILD_TYPE"
          echo "Build Label     : $BUILD_LABEL"
          echo "Source          : $SOURCE_DESCRIPTION"
          echo "Source Ref      : $SOURCE_REF"
          echo "Package Version : $PACKAGE_VERSION"
          echo "Git Commit      : $GIT_COMMIT"
          echo "=========================================="

          {
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo "BUILD_LABEL=$BUILD_LABEL"
            echo "SOURCE_DESCRIPTION=$SOURCE_DESCRIPTION"
            echo "SOURCE_REF=$SOURCE_REF"
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
            echo "GIT_COMMIT=$GIT_COMMIT"
            echo "GIT_COMMIT_FULL=$GIT_COMMIT_FULL"
          } >> "$GITHUB_ENV"

          {
            echo "build_type=$BUILD_TYPE"
            echo "build_label=$BUILD_LABEL"
            echo "package_version=$PACKAGE_VERSION"
            echo "git_commit=$GIT_COMMIT"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3. Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # ============================================================
      # 4. Rust Nightly
      # ============================================================
      - name: Setup Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # ============================================================
      # 5. Cargo cache
      # ============================================================
      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugin/smartdns-ui/target
          key: >-
            ${{ runner.os }}-cargo-openwrt-25.12.5-mt7621-v2-${{
            hashFiles('plugin/smartdns-ui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-openwrt-25.12.5-mt7621-
            ${{ runner.os }}-cargo-

      # ============================================================
      # 6. System dependencies
      # ============================================================
      - name: Install System Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            binutils \
            file \
            jq \
            wget \
            curl \
            ca-certificates \
            zstd \
            xz-utils \
            tar \
            unzip \
            make \
            gcc \
            g++ \
            pkg-config \
            libgtest-dev \
            dnsperf

          echo
          echo "=========================================="
          echo "Installing apk.static"
          echo "=========================================="

          APK_INDEX="$(
            wget -qO- \
              https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/
          )"

          APK_FILE="$(
            printf '%s\n' "$APK_INDEX" \
              | grep -oE 'apk-tools-static-[0-9][a-zA-Z0-9._-]*\.apk' \
              | sort -u \
              | sed -n '1p'
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Cannot find apk-tools-static."
            exit 1
          fi

          echo "APK tools package: $APK_FILE"

          wget \
            "https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/$APK_FILE" \
            -O /tmp/apk-tools-static.apk

          rm -rf /tmp/apk-static
          mkdir -p /tmp/apk-static

          tar \
            -zxf /tmp/apk-tools-static.apk \
            -C /tmp/apk-static

          sudo cp \
            /tmp/apk-static/sbin/apk.static \
            /usr/local/bin/apk

          sudo chmod +x \
            /usr/local/bin/apk

          apk --version

      # ============================================================
      # 7. Bindgen CLI
      # ============================================================
      - name: Cache Bindgen CLI
        uses: actions/cache@v5
        id: cache-bindgen
        with:
          path: ~/.cargo/bin/bindgen
          key: ${{ runner.os }}-bindgen-cli-nightly-v2

      - name: Install Bindgen CLI
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cargo install \
            --force \
            --locked \
            bindgen-cli

      # ============================================================
      # 8. Cache OpenWrt SDK
      # ============================================================
      - name: Cache OpenWrt SDK
        uses: actions/cache@v5
        id: cache-openwrt-sdk
        with:
          path: ~/openwrt-sdk
          key: >-
            ${{ runner.os }}-openwrt-sdk-25.12.5-ramips-mt7621-v4

      # ============================================================
      # 9. Download official OpenWrt SDK
      # ============================================================
      - name: Download OpenWrt 25.12.5 ramips mt7621 SDK
        if: steps.cache-openwrt-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"

          echo "=========================================="
          echo "OpenWrt SDK"
          echo "=========================================="
          echo "Version   : $OPENWRT_VERSION"
          echo "Target    : $OPENWRT_TARGET"
          echo "Subtarget : $OPENWRT_SUBTARGET"
          echo "Arch      : $OPENWRT_ARCH"
          echo "URL       : $BASE_URL/"
          echo "=========================================="

          INDEX="$(
            curl \
              --fail \
              --location \
              --retry 5 \
              --silent \
              --show-error \
              "$BASE_URL/"
          )"

          SDK_FILE="$(
            printf '%s\n' "$INDEX" \
              | grep -oE \
                "openwrt-sdk-${OPENWRT_VERSION}-${OPENWRT_TARGET}-${OPENWRT_SUBTARGET}_[^\"< ]+\.tar\.(zst|xz)" \
              | sort -u \
              | sed -n '1p'
          )"

          if [ -z "$SDK_FILE" ]; then
            echo "ERROR: OpenWrt SDK archive not found."
            echo
            echo "SDK entries found in index:"
            printf '%s\n' "$INDEX" \
              | grep -oE 'openwrt-sdk-[^"< ]+' \
              | sort -u \
              || true
            exit 1
          fi

          echo
          echo "SDK archive:"
          echo "$SDK_FILE"

          curl \
            --fail \
            --location \
            --retry 5 \
            --output "/tmp/$SDK_FILE" \
            "$BASE_URL/$SDK_FILE"

          rm -rf "$HOME/openwrt-sdk"
          rm -rf /tmp/openwrt-sdk-extract

          mkdir -p /tmp/openwrt-sdk-extract

          case "$SDK_FILE" in
            *.tar.zst)
              tar \
                --zstd \
                -xf "/tmp/$SDK_FILE" \
                -C /tmp/openwrt-sdk-extract
              ;;

            *.tar.xz)
              tar \
                -xJf "/tmp/$SDK_FILE" \
                -C /tmp/openwrt-sdk-extract
              ;;

            *)
              echo "ERROR: Unsupported SDK archive."
              exit 1
              ;;
          esac

          SDK_DIR=""

          for DIR in /tmp/openwrt-sdk-extract/*; do
            if [ -d "$DIR" ]; then
              SDK_DIR="$DIR"
              break
            fi
          done

          if [ -z "$SDK_DIR" ]; then
            echo "ERROR: SDK directory not found after extraction."
            exit 1
          fi

          mv "$SDK_DIR" "$HOME/openwrt-sdk"

          echo
          echo "=========================================="
          echo "SDK extracted successfully"
          echo "=========================================="

          ls -la "$HOME/openwrt-sdk"

      # ============================================================
      # 10. Locate official OpenWrt toolchain
      # ============================================================
      - name: Locate OpenWrt Toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/openwrt-sdk"

          echo "=========================================="
          echo "Searching OpenWrt toolchain"
          echo "=========================================="

          if [ ! -d "$SDK/staging_dir" ]; then
            echo "ERROR: staging_dir not found."
            exit 1
          fi

          TOOLCHAIN_DIR=""

          for DIR in "$SDK"/staging_dir/toolchain-mipsel_24kc_*; do
            if [ -d "$DIR" ]; then
              TOOLCHAIN_DIR="$DIR"
              break
            fi
          done

          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "ERROR: mipsel_24kc OpenWrt toolchain not found."
            echo
            echo "Available staging directories:"
            find "$SDK/staging_dir" \
              -maxdepth 1 \
              -type d \
              -print
            exit 1
          fi

          TOOLCHAIN_BIN="$TOOLCHAIN_DIR/bin"

          if [ ! -d "$TOOLCHAIN_BIN" ]; then
            echo "ERROR: Toolchain bin directory not found:"
            echo "$TOOLCHAIN_BIN"
            exit 1
          fi

          echo
          echo "Toolchain directory:"
          echo "$TOOLCHAIN_DIR"

          echo
          echo "Toolchain executables:"
          ls -la "$TOOLCHAIN_BIN"

          CC=""

          for CANDIDATE in \
            "$TOOLCHAIN_BIN/mipsel-openwrt-linux-musl-gcc" \
            "$TOOLCHAIN_BIN/mipsel-openwrt-linux-gcc"
          do
            if [ -x "$CANDIDATE" ]; then
              CC="$CANDIDATE"
              break
            fi
          done

          if [ -z "$CC" ]; then

            while IFS= read -r CANDIDATE; do
              BASENAME="$(basename "$CANDIDATE")"

              case "$BASENAME" in
                *gcc-[0-9]*)
                  continue
                  ;;
              esac

              CC="$CANDIDATE"
              break

            done < <(
              find "$TOOLCHAIN_BIN" \
                -maxdepth 1 \
                \( -type f -o -type l \) \
                -name '*gcc' \
                | sort
            )

          fi

          if [ -z "$CC" ]; then
            echo "ERROR: GCC not found in OpenWrt toolchain."
            exit 1
          fi

          CC_NAME="$(basename "$CC")"
          CROSS_PREFIX="${CC_NAME%gcc}"

          AR="${TOOLCHAIN_BIN}/${CROSS_PREFIX}ar"
          RANLIB="${TOOLCHAIN_BIN}/${CROSS_PREFIX}ranlib"
          STRIP="${TOOLCHAIN_BIN}/${CROSS_PREFIX}strip"
          READELF="${TOOLCHAIN_BIN}/${CROSS_PREFIX}readelf"
          OBJDUMP="${TOOLCHAIN_BIN}/${CROSS_PREFIX}objdump"

          for REQUIRED_TOOL in \
            "$CC" \
            "$AR" \
            "$RANLIB" \
            "$STRIP" \
            "$READELF" \
            "$OBJDUMP"
          do
            if [ ! -x "$REQUIRED_TOOL" ]; then
              echo "ERROR: Required tool not executable:"
              echo "$REQUIRED_TOOL"
              exit 1
            fi
          done

          echo
          echo "=========================================="
          echo "Official OpenWrt Toolchain"
          echo "=========================================="
          echo "TOOLCHAIN_DIR : $TOOLCHAIN_DIR"
          echo "TOOLCHAIN_BIN : $TOOLCHAIN_BIN"
          echo "CROSS_PREFIX  : $CROSS_PREFIX"
          echo "CC            : $CC"
          echo "AR            : $AR"
          echo "RANLIB        : $RANLIB"
          echo "STRIP         : $STRIP"
          echo "READELF       : $READELF"
          echo "OBJDUMP       : $OBJDUMP"
          echo "=========================================="

          "$CC" --version

          {
            echo "OPENWRT_SDK=$SDK"
            echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
            echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN"
            echo "CROSS_PREFIX=$CROSS_PREFIX"
            echo "OPENWRT_CC=$CC"
            echo "OPENWRT_AR=$AR"
            echo "OPENWRT_RANLIB=$RANLIB"
            echo "OPENWRT_STRIP=$STRIP"
            echo "OPENWRT_READELF=$READELF"
            echo "OPENWRT_OBJDUMP=$OBJDUMP"
          } >> "$GITHUB_ENV"

          {
            echo "toolchain_dir=$TOOLCHAIN_DIR"
            echo "toolchain_bin=$TOOLCHAIN_BIN"
            echo "cc=$CC"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 11. Verify OpenWrt ABI
      #
      # Router:
      # /lib/ld-musl-mipsel-sf.so.1
      #
      # SDK compiler must generate the same interpreter.
      # ============================================================
      - name: Verify OpenWrt mipsel_24kc ABI
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/openwrt-abi-test.c <<'EOF'
          #include <stdio.h>

          int main(void)
          {
              puts("OpenWrt ABI test");
              return 0;
          }
          EOF

          "$OPENWRT_CC" \
            -Os \
            /tmp/openwrt-abi-test.c \
            -o /tmp/openwrt-abi-test

          echo "=========================================="
          echo "OpenWrt ABI test ELF"
          echo "=========================================="

          file /tmp/openwrt-abi-test

          echo
          echo "--- ELF header ---"

          "$OPENWRT_READELF" \
            -h \
            /tmp/openwrt-abi-test

          echo
          echo "--- Program interpreter ---"

          "$OPENWRT_READELF" \
            -l \
            /tmp/openwrt-abi-test \
            | grep -i interpreter \
            || true

          INTERPRETER="$(
            "$OPENWRT_READELF" \
              -l \
              /tmp/openwrt-abi-test \
              | sed -n \
                's/.*Requesting program interpreter: \(.*\)]/\1/p'
          )"

          echo
          echo "Detected interpreter:"
          echo "$INTERPRETER"

          EXPECTED_INTERPRETER="/lib/ld-musl-mipsel-sf.so.1"

          if [ "$INTERPRETER" != "$EXPECTED_INTERPRETER" ]; then
            echo
            echo "=========================================="
            echo "ERROR: OpenWrt SDK ABI mismatch"
            echo "=========================================="
            echo "Expected:"
            echo "  $EXPECTED_INTERPRETER"
            echo
            echo "Actual:"
            echo "  $INTERPRETER"
            exit 1
          fi

          echo
          echo "ABI check PASSED."

      # ============================================================
      # 12. Locate OpenWrt Target Sysroot
      # ============================================================
      - name: Locate OpenWrt Target Sysroot
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR=""

          for DIR in "$OPENWRT_SDK"/staging_dir/target-mipsel_24kc_musl*; do
            if [ -d "$DIR" ]; then
              TARGET_DIR="$DIR"
              break
            fi
          done

          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: OpenWrt target sysroot not found."
            echo
            echo "Available staging directories:"

            find "$OPENWRT_SDK/staging_dir" \
              -maxdepth 1 \
              -type d \
              -print

            exit 1
          fi

          echo "OPENWRT_TARGET_DIR=$TARGET_DIR" \
            >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Target sysroot"
          echo "=========================================="
          echo "$TARGET_DIR"

          echo
          echo "Target sysroot top-level contents:"
          ls -la "$TARGET_DIR"

      # ============================================================
      # 13. Cache OpenSSL
      # ============================================================
      - name: Cache OpenSSL for OpenWrt MT7621
        uses: actions/cache@v5
        id: cache-openssl
        with:
          path: ~/openssl-openwrt-mt7621
          key: >-
            ${{ runner.os }}-openssl-3.5.4-openwrt-25.12.5-mt7621-v5

      # ============================================================
      # 14. Build OpenSSL using official OpenWrt compiler
      # ============================================================
      - name: Build OpenSSL for OpenWrt MT7621
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          OPENSSL_VERSION="3.5.4"

          echo "=========================================="
          echo "Building OpenSSL $OPENSSL_VERSION"
          echo "=========================================="
          echo "Compiler:"
          echo "$OPENWRT_CC"

          curl \
            --fail \
            --location \
            --retry 5 \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" \
            -o "/tmp/openssl-${OPENSSL_VERSION}.tar.gz"

          rm -rf /tmp/openssl-build
          rm -rf "$HOME/openssl-openwrt-mt7621"

          mkdir -p /tmp/openssl-build
          mkdir -p "$HOME/openssl-openwrt-mt7621"

          tar \
            -xzf "/tmp/openssl-${OPENSSL_VERSION}.tar.gz" \
            -C /tmp/openssl-build

          cd "/tmp/openssl-build/openssl-${OPENSSL_VERSION}"

          export PATH="$TOOLCHAIN_BIN:$PATH"

          export CC="$OPENWRT_CC"
          export AR="$OPENWRT_AR"
          export RANLIB="$OPENWRT_RANLIB"

          export CFLAGS="-Os -fPIC"

          ./Configure \
            linux-generic32 \
            --prefix="$HOME/openssl-openwrt-mt7621" \
            --openssldir="$HOME/openssl-openwrt-mt7621/ssl" \
            no-shared \
            no-tests \
            no-apps \
            no-argon2 \
            no-aria \
            no-async \
            no-bf \
            no-blake2 \
            no-camellia \
            no-cmp \
            no-cms \
            no-comp \
            no-des \
            no-dh \
            no-dsa \
            no-ec2m \
            no-engine \
            no-gost \
            no-http \
            no-idea \
            no-legacy \
            no-md4 \
            no-mdc2 \
            no-multiblock \
            no-nextprotoneg \
            no-ocb \
            no-ocsp \
            no-rc2 \
            no-rc4 \
            no-rmd160 \
            no-scrypt \
            no-seed \
            no-siphash \
            no-siv \
            no-sm2 \
            no-sm3 \
            no-sm4 \
            no-srp \
            no-srtp \
            no-ts \
            no-whirlpool \
            no-ssl-trace \
            no-ssl \
            no-ssl3

          make -j"$(nproc)"

          make install_sw

          echo
          echo "=========================================="
          echo "Validating OpenSSL installation"
          echo "=========================================="

          if [ ! -f "$HOME/openssl-openwrt-mt7621/lib/libcrypto.a" ]; then
            echo "ERROR: libcrypto.a not found."
            exit 1
          fi

          if [ ! -f "$HOME/openssl-openwrt-mt7621/lib/libssl.a" ]; then
            echo "ERROR: libssl.a not found."
            exit 1
          fi

          if [ ! -f "$HOME/openssl-openwrt-mt7621/include/openssl/ssl.h" ]; then
            echo "ERROR: openssl/ssl.h not found."
            exit 1
          fi

          ls -lh \
            "$HOME/openssl-openwrt-mt7621/lib/libcrypto.a" \
            "$HOME/openssl-openwrt-mt7621/lib/libssl.a" \
            "$HOME/openssl-openwrt-mt7621/include/openssl/ssl.h"

          echo
          echo "OpenSSL validation PASSED."

      # ============================================================
      # 15. Validate cached OpenSSL too
      # ============================================================
      - name: Validate OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OpenSSL validation"
          echo "=========================================="

          REQUIRED_FILES=(
            "$HOME/openssl-openwrt-mt7621/lib/libcrypto.a"
            "$HOME/openssl-openwrt-mt7621/lib/libssl.a"
            "$HOME/openssl-openwrt-mt7621/include/openssl/ssl.h"
          )

          for FILE_PATH in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE_PATH" ]; then
              echo "ERROR: Required OpenSSL file missing:"
              echo "$FILE_PATH"
              exit 1
            fi

            echo "OK: $FILE_PATH"
          done

          echo
          echo "OpenSSL ready."

      # ============================================================
      # 16. Configure Rust linker
      # ============================================================
      - name: Configure Rust for OpenWrt MT7621
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cargo"

          cat > "$HOME/.cargo/config.toml" <<EOF
          [target.mipsel-unknown-linux-musl]
          linker = "$OPENWRT_CC"

          rustflags = [
              "-C", "target-cpu=mips32r2",
              "-C", "target-feature=+mips32r2,+soft-float"
          ]
          EOF

          echo "=========================================="
          echo "Rust configuration"
          echo "=========================================="

          rustc --version
          cargo --version

          echo
          echo "Cargo config:"
          cat "$HOME/.cargo/config.toml"

          echo
          echo "Rust target information:"

          rustc \
            +nightly \
            -Z unstable-options \
            --print target-spec-json \
            --target "$RUST_TARGET" \
            | grep -E \
              '"arch"|"cpu"|"data-layout"|"features"|"llvm-target"' \
            || true

      # ============================================================
      # 17. Patch SmartDNS UI for Rust build-std
      # ============================================================
      - name: Patch SmartDNS UI for Rust build-std
        shell: bash
        run: |
          set -euo pipefail

          MAKEFILE="plugin/smartdns-ui/Makefile"

          if [ ! -f "$MAKEFILE" ]; then
            echo "ERROR: SmartDNS UI Makefile not found:"
            echo "$MAKEFILE"
            exit 1
          fi

          echo "Original cargo commands:"
          grep -n "cargo.*build" "$MAKEFILE" || true

          if ! grep -q \
            'cargo build -Z build-std=std,panic_abort' \
            "$MAKEFILE"; then

            sed -i \
              's/cargo build/cargo build -Z build-std=std,panic_abort/g' \
              "$MAKEFILE"

          fi

          echo
          echo "Patched cargo commands:"
          grep -n "cargo.*build" "$MAKEFILE" || true

          if ! grep -q \
            'cargo build -Z build-std=std,panic_abort' \
            "$MAKEFILE"; then

            echo "ERROR: Failed to patch SmartDNS UI Makefile."
            exit 1
          fi

          echo
          echo "SmartDNS UI Makefile patch PASSED."

      # ============================================================
      # 18. Build SmartDNS + Dashboard
      # ============================================================
      - name: Build SmartDNS with Dashboard UI
        shell: bash
        run: |
          set -euo pipefail

          export RELEASE_VERSION="$PACKAGE_VERSION"

          export PATH="$TOOLCHAIN_BIN:$PATH"

          export CC="$OPENWRT_CC"
          export AR="$OPENWRT_AR"
          export RANLIB="$OPENWRT_RANLIB"
          export STRIP="$OPENWRT_STRIP"

          export STATIC=yes

          # ========================================================
          # OpenSSL
          # ========================================================
          export OPENSSL_ROOT_DIR="$HOME/openssl-openwrt-mt7621"
          export OPENSSL_DIR="$HOME/openssl-openwrt-mt7621"
          export OPENSSL_LIB_DIR="$HOME/openssl-openwrt-mt7621/lib"
          export OPENSSL_INCLUDE_DIR="$HOME/openssl-openwrt-mt7621/include"

          export PKG_CONFIG_ALLOW_CROSS=1

          # ========================================================
          # SmartDNS C flags
          #
          # CPU/ABI is controlled by official OpenWrt compiler.
          # ========================================================
          export CFLAGS="-DFEATURE_CHECK_EDNS \
          -O2 \
          -g \
          -Wall \
          -Wstrict-prototypes \
          -fno-omit-frame-pointer \
          -Wstrict-aliasing \
          -funwind-tables \
          -Wmissing-prototypes \
          -Wshadow \
          -Wextra \
          -Wno-unused-parameter \
          -Wno-implicit-fallthrough \
          -I$HOME/openssl-openwrt-mt7621/include"

          export LDFLAGS="-L$HOME/openssl-openwrt-mt7621/lib"

          export CARGO_BUILD_TARGET="$RUST_TARGET"

          echo "=========================================="
          echo "SmartDNS Build"
          echo "=========================================="
          echo "OpenWrt Version : $OPENWRT_VERSION"
          echo "Target          : $OPENWRT_TARGET/$OPENWRT_SUBTARGET"
          echo "Package Arch    : $OPENWRT_ARCH"
          echo "Compiler        : $CC"
          echo "Rust Target     : $RUST_TARGET"
          echo "SmartDNS Source : $SOURCE_DESCRIPTION"
          echo "Version         : $RELEASE_VERSION"
          echo "=========================================="

          "$CC" --version

          chmod +x package/build-pkg.sh

          ./package/build-pkg.sh \
            --platform openwrt \
            --arch all \
            --filearch=mipsel_24kc-openwrt-all \
            --ver "$RELEASE_VERSION" \
            --outputdir "$GITHUB_WORKSPACE" \
            --with-ui

          echo
          echo "=========================================="
          echo "SmartDNS build completed"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 6 \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "smartdns" \
              -o \
              -name "smartdns_ui.so" \
            \) \
            -print

      # ============================================================
      # 19. Find and inspect SmartDNS ELF files
      # ============================================================
      - name: Inspect Built ELF Files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Finding SmartDNS ELF files"
          echo "=========================================="

          mapfile -t ELF_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( \
                -name "smartdns" \
                -o \
                -name "smartdns_ui.so" \
              \) \
              -print
          )

          if [ "${#ELF_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No SmartDNS ELF files found."
            exit 1
          fi

          echo "Found ${#ELF_FILES[@]} candidate ELF files."

          for FILE_PATH in "${ELF_FILES[@]}"; do

            echo
            echo "=========================================="
            echo "$FILE_PATH"
            echo "=========================================="

            file "$FILE_PATH" || true

            echo
            echo "--- ELF header ---"

            "$OPENWRT_READELF" \
              -h \
              "$FILE_PATH" \
              || true

            echo
            echo "--- Program interpreter ---"

            "$OPENWRT_READELF" \
              -l \
              "$FILE_PATH" \
              | grep -i interpreter \
              || true

            echo
            echo "--- Dynamic dependencies ---"

            "$OPENWRT_READELF" \
              -d \
              "$FILE_PATH" \
              | grep -E 'NEEDED|RPATH|RUNPATH' \
              || true

            echo
            echo "--- MIPS attributes ---"

            "$OPENWRT_READELF" \
              -A \
              "$FILE_PATH" \
              || true

          done

      # ============================================================
      # 20. Validate SmartDNS loader
      #
      # Critical check:
      #
      # Router has:
      # /lib/ld-musl-mipsel-sf.so.1
      #
      # Reject APK if SmartDNS uses:
      # /lib/ld-musl-mipsel.so.1
      # ============================================================
      - name: Validate SmartDNS OpenWrt Loader
        shell: bash
        run: |
          set -euo pipefail

          SMARTDNS_BIN=""

          while IFS= read -r FILE_PATH; do

            if [ ! -x "$FILE_PATH" ]; then
              continue
            fi

            if file "$FILE_PATH" | grep -q 'ELF'; then
              SMARTDNS_BIN="$FILE_PATH"
              break
            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name smartdns \
              -print
          )

          if [ -z "$SMARTDNS_BIN" ]; then
            echo "ERROR: SmartDNS executable ELF not found."
            exit 1
          fi

          echo "=========================================="
          echo "SmartDNS executable"
          echo "=========================================="
          echo "$SMARTDNS_BIN"

          file "$SMARTDNS_BIN"

          echo
          echo "ELF header:"
          "$OPENWRT_READELF" \
            -h \
            "$SMARTDNS_BIN"

          echo
          echo "Program headers:"
          "$OPENWRT_READELF" \
            -l \
            "$SMARTDNS_BIN"

          INTERPRETER="$(
            "$OPENWRT_READELF" \
              -l \
              "$SMARTDNS_BIN" \
              | sed -n \
                's/.*Requesting program interpreter: \(.*\)]/\1/p'
          )"

          EXPECTED_INTERPRETER="/lib/ld-musl-mipsel-sf.so.1"

          echo
          echo "=========================================="
          echo "SmartDNS loader check"
          echo "=========================================="
          echo "Expected : $EXPECTED_INTERPRETER"
          echo "Actual   : $INTERPRETER"
          echo "=========================================="

          if [ -z "$INTERPRETER" ]; then
            echo
            echo "ERROR: SmartDNS ELF interpreter could not be detected."
            exit 1
          fi

          if [ "$INTERPRETER" != "$EXPECTED_INTERPRETER" ]; then

            echo
            echo "=========================================="
            echo "ERROR: WRONG SMARTDNS LOADER"
            echo "=========================================="
            echo
            echo "Expected:"
            echo "  $EXPECTED_INTERPRETER"
            echo
            echo "Actual:"
            echo "  $INTERPRETER"
            echo
            echo "APK WILL NOT BE UPLOADED."
            echo

            exit 1
          fi

          echo
          echo "SmartDNS loader validation PASSED."

      # ============================================================
      # 21. Validate MIPS ABI attributes
      # ============================================================
      - name: Validate SmartDNS MIPS Attributes
        shell: bash
        run: |
          set -euo pipefail

          SMARTDNS_BIN=""

          while IFS= read -r FILE_PATH; do

            if [ ! -x "$FILE_PATH" ]; then
              continue
            fi

            if file "$FILE_PATH" | grep -q 'ELF'; then
              SMARTDNS_BIN="$FILE_PATH"
              break
            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name smartdns \
              -print
          )

          if [ -z "$SMARTDNS_BIN" ]; then
            echo "ERROR: SmartDNS executable not found."
            exit 1
          fi

          echo "=========================================="
          echo "SmartDNS MIPS ABI attributes"
          echo "=========================================="

          "$OPENWRT_READELF" \
            -A \
            "$SMARTDNS_BIN" \
            || true

          echo
          echo "ELF flags:"
          "$OPENWRT_READELF" \
            -h \
            "$SMARTDNS_BIN" \
            | grep -E \
              'Class:|Data:|Machine:|Flags:' \
            || true

      # ============================================================
      # 22. Build LuCI
      # ============================================================
      - name: Build LuCI App APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x package/build-pkg.sh

          ./package/build-pkg.sh \
            --platform luci \
            --arch all \
            --filearch=all-luci-all \
            --ver "$PACKAGE_VERSION" \
            --outputdir "$GITHUB_WORKSPACE" \
            --only-package

          echo
          echo "=========================================="
          echo "LuCI APK build completed"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 6 \
            -type f \
            -name "luci-app-smartdns*.apk" \
            -print

      # ============================================================
      # 23. Collect APKs
      # ============================================================
      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-assets
          mkdir -p release-assets

          echo "=========================================="
          echo "Collecting SmartDNS APK"
          echo "=========================================="

          SMARTDNS_COUNT=0

          while IFS= read -r APK_FILE; do
            cp -v "$APK_FILE" release-assets/
            SMARTDNS_COUNT=$((SMARTDNS_COUNT + 1))
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "smartdns.*.mipsel_24kc-openwrt-all.apk" \
              -not -path "$GITHUB_WORKSPACE/release-assets/*" \
              -print
          )

          echo
          echo "=========================================="
          echo "Collecting LuCI APK"
          echo "=========================================="

          LUCI_COUNT=0

          while IFS= read -r APK_FILE; do
            cp -v "$APK_FILE" release-assets/
            LUCI_COUNT=$((LUCI_COUNT + 1))
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "luci-app-smartdns.*.all-luci-all.apk" \
              -not -path "$GITHUB_WORKSPACE/release-assets/*" \
              -print
          )

          echo
          echo "SmartDNS APK count: $SMARTDNS_COUNT"
          echo "LuCI APK count    : $LUCI_COUNT"

          if [ "$SMARTDNS_COUNT" -lt 1 ]; then
            echo "ERROR: SmartDNS APK not found."
            exit 1
          fi

          if [ "$LUCI_COUNT" -lt 1 ]; then
            echo "ERROR: LuCI APK not found."
            exit 1
          fi

          cat > release-assets/BUILD-INFO.txt <<EOF
          SmartDNS Custom OpenWrt Build
          ========================================

          SmartDNS Build Type:
          $BUILD_TYPE

          SmartDNS Build Label:
          $BUILD_LABEL

          SmartDNS Source:
          $SOURCE_DESCRIPTION

          SmartDNS Source Ref:
          $SOURCE_REF

          SmartDNS Commit:
          $GIT_COMMIT_FULL

          Package Version:
          $PACKAGE_VERSION

          ----------------------------------------

          OpenWrt Version:
          $OPENWRT_VERSION

          OpenWrt Target:
          $OPENWRT_TARGET/$OPENWRT_SUBTARGET

          OpenWrt Package Architecture:
          $OPENWRT_ARCH

          Hardware Family:
          MediaTek MT7621

          CPU:
          MIPS 1004Kc

          ISA:
          MIPS32r2

          Endian:
          Little Endian

          Runtime Loader:
          /lib/ld-musl-mipsel-sf.so.1

          ----------------------------------------

          Toolchain:
          Official OpenWrt SDK Toolchain

          Toolchain Directory:
          $TOOLCHAIN_DIR

          Compiler:
          $OPENWRT_CC

          ----------------------------------------

          OpenSSL:
          3.5.4

          OpenSSL Build:
          Official OpenWrt compiler

          ----------------------------------------

          Dashboard UI:
          YES

          LuCI:
          YES

          Rust Target:
          $RUST_TARGET

          Rust build-std:
          YES

          Package Format:
          APK

          ========================================
          EOF

          echo
          echo "=========================================="
          echo "Release files"
          echo "=========================================="

          ls -lh release-assets/

          echo
          echo "=========================================="
          echo "BUILD-INFO.txt"
          echo "=========================================="

          cat release-assets/BUILD-INFO.txt

      # ============================================================
      # 24. Final validation
      # ============================================================
      - name: Final Package Validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Final package validation"
          echo "=========================================="

          SMARTDNS_APK_FOUND=0
          LUCI_APK_FOUND=0

          for FILE_PATH in release-assets/*.apk; do

            if [ ! -f "$FILE_PATH" ]; then
              continue
            fi

            FILE_NAME="$(basename "$FILE_PATH")"

            echo
            echo "APK:"
            echo "$FILE_NAME"

            case "$FILE_NAME" in

              smartdns.*.mipsel_24kc-openwrt-all.apk)
                SMARTDNS_APK_FOUND=1
                ;;

              luci-app-smartdns.*.all-luci-all.apk)
                LUCI_APK_FOUND=1
                ;;

            esac

          done

          if [ "$SMARTDNS_APK_FOUND" -ne 1 ]; then
            echo "ERROR: Final SmartDNS APK missing."
            exit 1
          fi

          if [ "$LUCI_APK_FOUND" -ne 1 ]; then
            echo "ERROR: Final LuCI APK missing."
            exit 1
          fi

          echo
          echo "Final package validation PASSED."

      # ============================================================
      # 25. Upload
      # ============================================================
      - name: Upload SmartDNS + LuCI APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: >-
            smartdns-${{ steps.version.outputs.build_label }}-openwrt-25.12.5-ramips-mt7621-${{ steps.version.outputs.git_commit }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
