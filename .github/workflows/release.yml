name: Build SmartDNS MIPSEL OpenWrt APK with UI + LuCI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build version'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - stable

permissions:
  contents: read

jobs:
  build:
    name: Build MIPSEL OpenWrt APK + UI + LuCI
    runs-on: ubuntu-22.04

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      #
      # 先完整拉取仓库和所有 tag。
      #
      # nightly:
      #   使用当前 master
      #
      # stable:
      #   后面自动切换到最新 ReleaseXX tag
      # ------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. 选择 Nightly / Stable 源码
      #
      # nightly:
      #   使用 master 当前 HEAD
      #
      # stable:
      #   自动寻找最新正式 Release tag，
      #   例如 Release48.4，并 checkout 到该 tag
      # ------------------------------------------------------------
      - name: Select SmartDNS Version
        id: version
        shell: bash
        run: |
          set -e

          BUILD_TYPE="${{ inputs.build_type }}"

          echo "=========================================="
          echo "Requested build type: $BUILD_TYPE"
          echo "=========================================="

          # 确保 tag 完整
          git fetch --force --tags

          if [ "$BUILD_TYPE" = "stable" ]; then

            echo
            echo "Finding latest official Release tag..."

            LATEST_RELEASE=$(
              git tag -l 'Release*' \
              | grep -E '^Release[0-9]+([.][0-9]+)*$' \
              | sort -V \
              | tail -n 1
            )

            if [ -z "$LATEST_RELEASE" ]; then
              echo "ERROR: No official Release tag found."
              exit 1
            fi

            echo "Latest official release: $LATEST_RELEASE"

            git checkout --force "$LATEST_RELEASE"

            BUILD_LABEL="$LATEST_RELEASE"
            SOURCE_DESCRIPTION="Official Stable Release $LATEST_RELEASE"

          elif [ "$BUILD_TYPE" = "nightly" ]; then

            # workflow 本身从 master 运行时，
            # 当前 checkout 就是当前 fork master。
            #
            # 明确记录当前 HEAD，不切换到 Release tag。

            BUILD_LABEL="nightly"
            SOURCE_DESCRIPTION="Nightly build from master"

          else

            echo "ERROR: Unknown build type: $BUILD_TYPE"
            exit 1

          fi

          PACKAGE_VERSION="$(date +"1.%Y.%m.%d-%H%M")"

          GIT_COMMIT="$(git rev-parse --short=7 HEAD)"
          GIT_COMMIT_FULL="$(git rev-parse HEAD)"

          if [ "$BUILD_TYPE" = "stable" ]; then
            SOURCE_REF="$LATEST_RELEASE"
          else
            SOURCE_REF="master"
          fi

          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "BUILD_LABEL=$BUILD_LABEL" >> "$GITHUB_ENV"
          echo "SOURCE_DESCRIPTION=$SOURCE_DESCRIPTION" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=$GIT_COMMIT" >> "$GITHUB_ENV"
          echo "GIT_COMMIT_FULL=$GIT_COMMIT_FULL" >> "$GITHUB_ENV"

          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "build_label=$BUILD_LABEL" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "git_commit=$GIT_COMMIT" >> "$GITHUB_OUTPUT"

          echo
          echo "=========================================="
          echo "SmartDNS Source Information"
          echo "=========================================="
          echo "Build Type      : $BUILD_TYPE"
          echo "Build Label     : $BUILD_LABEL"
          echo "Source          : $SOURCE_DESCRIPTION"
          echo "Source Ref      : $SOURCE_REF"
          echo "Package Version : $PACKAGE_VERSION"
          echo "Git Commit      : $GIT_COMMIT"
          echo "=========================================="

      # ------------------------------------------------------------
      # 3. Node.js
      # SmartDNS WebUI 编译需要
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # ------------------------------------------------------------
      # 4. Rust Nightly + rust-src
      #
      # mipsel-unknown-linux-musl 没有官方预编译标准库，
      # 使用 nightly + rust-src + build-std。
      # ------------------------------------------------------------
      - name: Setup Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # ------------------------------------------------------------
      # 5. Cargo 缓存
      # ------------------------------------------------------------
      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugin/smartdns-ui/target
          key: ${{ runner.os }}-cargo-mipsel-nightly-${{ hashFiles('plugin/smartdns-ui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mipsel-nightly-
            ${{ runner.os }}-cargo-

      # ------------------------------------------------------------
      # 6. 系统依赖
      # ------------------------------------------------------------
      - name: Install System Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            libgtest-dev \
            dnsperf \
            jq \
            wget \
            unzip \
            tar \
            make \
            gcc

          # 安装 Alpine apk.static
          APK_FILE=$(wget -qO- \
            https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/ \
            | grep -oE 'apk-tools-static-[0-9][a-zA-Z0-9.-]*\.apk' \
            | head -n 1)

          wget \
            "https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/$APK_FILE" \
            -O /tmp/apk-tools-static.apk

          tar -zxf /tmp/apk-tools-static.apk -C /tmp

          sudo cp /tmp/sbin/apk.static /usr/local/bin/apk
          sudo cp /tmp/sbin/apk.static /usr/bin/apk

          sudo chmod +x \
            /usr/local/bin/apk \
            /usr/bin/apk

          apk --version

      # ------------------------------------------------------------
      # 7. bindgen
      # ------------------------------------------------------------
      - name: Cache Bindgen CLI
        uses: actions/cache@v5
        id: cache-bindgen
        with:
          path: ~/.cargo/bin/bindgen
          key: ${{ runner.os }}-bindgen-cli-nightly-0.69.5

      - name: Install Bindgen CLI
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: |
          cargo install --force --locked bindgen-cli

      # ------------------------------------------------------------
      # 8. MIPSEL Toolchain + OpenSSL 缓存
      # ------------------------------------------------------------
      - name: Cache MIPSEL Toolchain and OpenSSL
        uses: actions/cache@v5
        id: cache-toolchain
        with:
          path: ~/toolchain
          key: ${{ runner.os }}-mipsel-toolchain-openssl-3.5.4-v1

      - name: Link Toolchain Directory
        run: |
          sudo mkdir -p /opt
          sudo ln -sfn "$HOME/toolchain" /opt/toolchain

      # ------------------------------------------------------------
      # 9. 下载 MIPSEL musl Toolchain
      # ------------------------------------------------------------
      - name: Setup MIPSEL Musl Cross Compiler
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e

          mkdir -p "$HOME/toolchain"

          URL="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/mipsel-linux-musl-cross.tgz"

          wget "$URL" \
            -O /tmp/mipsel-toolchain.tgz

          gzip -t /tmp/mipsel-toolchain.tgz

          tar \
            -C "$HOME/toolchain" \
            -xzf /tmp/mipsel-toolchain.tgz

          cd "$HOME/toolchain"

          ln -s \
            mipsel-linux-musl-cross \
            mipsel-unknown-linux-musl

          PREFIX_FROM="mipsel-linux-musl"
          PREFIX_TO="mipsel-unknown-linux-musl"

          for f in \
            "$HOME/toolchain/mipsel-linux-musl-cross/bin/${PREFIX_FROM}"-*; do

            if [ -f "$f" ]; then

              base=$(basename "$f")

              new_base=$(echo "$base" \
                | sed "s/$PREFIX_FROM/$PREFIX_TO/")

              ln -s "$f" \
                "$HOME/toolchain/mipsel-linux-musl-cross/bin/$new_base"

            fi
          done

          ln -s \
            "${PREFIX_FROM}-objdump" \
            "$HOME/toolchain/mipsel-linux-musl-cross/bin/objdump"

      # ------------------------------------------------------------
      # 10. 编译 MIPSEL OpenSSL
      # ------------------------------------------------------------
      - name: Compile OpenSSL for MIPSEL
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e

          wget -q \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz \
            -O /tmp/openssl-3.5.4.tar.gz

          mkdir -p /tmp/build-openssl

          cd /tmp/build-openssl

          tar -xzf /tmp/openssl-3.5.4.tar.gz

          cd openssl-3.5.4

          CC="/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-gcc"

          SYSROOT=$($CC --print-sysroot)

          CC="$CC" ./Configure \
            linux-generic32 \
            --prefix="$SYSROOT" \
            no-shared \
            no-tests \
            no-apps \
            no-argon2 \
            no-aria \
            no-async \
            no-bf \
            no-blake2 \
            no-camellia \
            no-cmp \
            no-cms \
            no-comp \
            no-des \
            no-dh \
            no-dsa \
            no-ec2m \
            no-engine \
            no-gost \
            no-http \
            no-idea \
            no-legacy \
            no-md4 \
            no-mdc2 \
            no-multiblock \
            no-nextprotoneg \
            no-ocb \
            no-ocsp \
            no-rc2 \
            no-rc4 \
            no-rmd160 \
            no-scrypt \
            no-seed \
            no-siphash \
            no-siv \
            no-sm2 \
            no-sm3 \
            no-sm4 \
            no-srp \
            no-srtp \
            no-ts \
            no-whirlpool \
            no-ssl-trace \
            no-ssl \
            no-ssl3 \
            -Os

          make -j$(nproc)

          sudo make install_sw

      # ------------------------------------------------------------
      # 11. 配置 Rust MIPSEL Linker
      # ------------------------------------------------------------
      - name: Configure Rust MIPSEL Linker
        run: |
          set -e

          mkdir -p "$HOME/.cargo"

          cat > "$HOME/.cargo/config.toml" <<'EOF'
          [target.mipsel-unknown-linux-musl]
          linker = "/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-gcc"
          EOF

          echo "=========================================="
          echo "Rust:"
          echo "=========================================="

          rustc --version
          cargo --version

          echo
          echo "=========================================="
          echo "Installed Rust components:"
          echo "=========================================="

          rustup component list --installed

          echo
          echo "=========================================="
          echo "Cargo config:"
          echo "=========================================="

          cat "$HOME/.cargo/config.toml"

      # ------------------------------------------------------------
      # 12. Patch SmartDNS UI
      #
      # mipsel-unknown-linux-musl 没有预编译 core/std。
      # 强制 cargo build 使用 build-std。
      # ------------------------------------------------------------
      - name: Patch SmartDNS UI for MIPSEL build-std
        run: |
          set -e

          MAKEFILE="plugin/smartdns-ui/Makefile"

          echo "=========================================="
          echo "Original Cargo commands:"
          echo "=========================================="

          grep -n "cargo.*build" "$MAKEFILE" || true

          sed -i \
            's/cargo build/cargo build -Z build-std=std,panic_abort/g' \
            "$MAKEFILE"

          echo
          echo "=========================================="
          echo "Patched Cargo commands:"
          echo "=========================================="

          grep -n "cargo.*build" "$MAKEFILE" || true

          echo
          echo "=========================================="
          echo "Check patch:"
          echo "=========================================="

          if ! grep -q \
            'cargo build -Z build-std=std,panic_abort' \
            "$MAKEFILE"; then

            echo "ERROR: Failed to patch smartdns-ui Makefile."
            exit 1
          fi

      # ------------------------------------------------------------
      # 13. 编译 SmartDNS MIPSEL + Dashboard UI
      #
      # 生成：
      # smartdns.*.mipsel-openwrt-all.apk
      # ------------------------------------------------------------
      - name: Build SmartDNS MIPSEL OpenWrt with Dashboard UI
        run: |
          set -e

          export RELEASE_VERSION="$PACKAGE_VERSION"

          export STATIC=yes

          export CFLAGS="-DFEATURE_CHECK_EDNS \
          -O2 \
          -g \
          -Wall \
          -Wstrict-prototypes \
          -fno-omit-frame-pointer \
          -Wstrict-aliasing \
          -funwind-tables \
          -Wmissing-prototypes \
          -Wshadow \
          -Wextra \
          -Wno-unused-parameter \
          -Wno-implicit-fallthrough"

          export CC=/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-gcc

          export PATH="$(dirname "$CC"):$PATH"

          echo "=========================================="
          echo "Building SmartDNS"
          echo "=========================================="
          echo "Build Type      : $BUILD_TYPE"
          echo "Build Label     : $BUILD_LABEL"
          echo "Source Ref      : $SOURCE_REF"
          echo "Package Version : $RELEASE_VERSION"
          echo "Git Commit      : $GIT_COMMIT"
          echo "=========================================="

          "$CC" --version

          rustc --version
          cargo --version

          echo
          echo "=========================================="
          echo "Final smartdns-ui Cargo command:"
          echo "=========================================="

          grep -n \
            "cargo.*build" \
            plugin/smartdns-ui/Makefile \
            || true

          chmod +x package/build-pkg.sh

          ./package/build-pkg.sh \
            --platform openwrt \
            --arch all \
            --filearch=mipsel-openwrt-all \
            --ver "$RELEASE_VERSION" \
            --outputdir "$GITHUB_WORKSPACE" \
            --with-ui

          echo
          echo "=========================================="
          echo "SmartDNS build completed"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "smartdns_ui.so" \
            \) \
            -print

      # ------------------------------------------------------------
      # 14. 编译 LuCI APP
      #
      # LuCI 为 all 架构。
      #
      # 生成：
      # luci-app-smartdns.*.all-luci-all.apk
      # ------------------------------------------------------------
      - name: Build LuCI App APK
        run: |
          set -e

          echo "=========================================="
          echo "Building LuCI App"
          echo "=========================================="
          echo "Build Type      : $BUILD_TYPE"
          echo "Build Label     : $BUILD_LABEL"
          echo "Package Version : $PACKAGE_VERSION"
          echo "=========================================="

          chmod +x package/build-pkg.sh

          ./package/build-pkg.sh \
            --platform luci \
            --arch all \
            --filearch=all-luci-all \
            --ver "$PACKAGE_VERSION" \
            --outputdir "$GITHUB_WORKSPACE" \
            --only-package

          echo
          echo "=========================================="
          echo "LuCI build completed"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -type f \
            -name "luci-app-smartdns*.apk" \
            -print

      # ------------------------------------------------------------
      # 15. 收集 APK + BUILD-INFO.txt
      # ------------------------------------------------------------
      - name: Collect APKs and Build Information
        run: |
          set -e

          mkdir -p release-assets

          echo "=========================================="
          echo "Searching SmartDNS APK..."
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "smartdns.*.mipsel-openwrt-all.apk" \
            -exec cp -v {} release-assets/ \;

          echo
          echo "=========================================="
          echo "Searching LuCI APK..."
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "luci-app-smartdns.*.all-luci-all.apk" \
            -exec cp -v {} release-assets/ \;

          cat > release-assets/BUILD-INFO.txt <<EOF
          SmartDNS MIPSEL OpenWrt Build
          ========================================

          Build Type      : $BUILD_TYPE
          Build Label     : $BUILD_LABEL
          Source          : $SOURCE_DESCRIPTION
          Source Ref      : $SOURCE_REF

          Package Version : $PACKAGE_VERSION

          Git Commit      : $GIT_COMMIT
          Full Git Commit : $GIT_COMMIT_FULL

          Architecture    : MIPSEL
          Package Format  : OpenWrt APK

          Dashboard UI    : YES
          LuCI APP        : YES

          Rust Target     : mipsel-unknown-linux-musl
          Rust build-std  : YES

          ========================================
          EOF

          echo
          echo "=========================================="
          echo "BUILD INFORMATION"
          echo "=========================================="

          cat release-assets/BUILD-INFO.txt

          echo
          echo "=========================================="
          echo "Generated files"
          echo "=========================================="

          ls -lh release-assets/

          SMARTDNS_COUNT=$(find release-assets \
            -maxdepth 1 \
            -type f \
            -name "smartdns.*.mipsel-openwrt-all.apk" \
            | wc -l)

          LUCI_COUNT=$(find release-assets \
            -maxdepth 1 \
            -type f \
            -name "luci-app-smartdns.*.all-luci-all.apk" \
            | wc -l)

          echo
          echo "SmartDNS APK count: $SMARTDNS_COUNT"
          echo "LuCI APK count:     $LUCI_COUNT"

          if [ "$SMARTDNS_COUNT" -lt 1 ]; then
            echo "ERROR: SmartDNS MIPSEL APK was not generated."
            exit 1
          fi

          if [ "$LUCI_COUNT" -lt 1 ]; then
            echo "ERROR: LuCI APP APK was not generated."
            exit 1
          fi

      # ------------------------------------------------------------
      # 16. 上传 Artifact
      #
      # Nightly 示例：
      #
      # smartdns-nightly-mipsel-openwrt-ui-luci-abcdef1
      #
      # Stable 示例：
      #
      # smartdns-Release48.4-mipsel-openwrt-ui-luci-21c940e
      # ------------------------------------------------------------
      - name: Upload SmartDNS + LuCI APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: smartdns-${{ steps.version.outputs.build_label }}-mipsel-openwrt-ui-luci-${{ steps.version.outputs.git_commit }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
