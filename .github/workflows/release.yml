name: Build SmartDNS OpenWrt mipsel_24kc APK with UI + LuCI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # ============================================================
  # OpenWrt Target
  # ============================================================
  OPENWRT_ARCH: mipsel_24kc
  TARGET_CPU: 24kc
  TARGET_ISA: mips32r2
  RUST_TARGET: mipsel-unknown-linux-musl

  # OpenWrt 24kc:
  # CPU_CFLAGS_24kc = -mips32r2 -mtune=24kc
  #
  # 同时使用：
  # -msoft-float
  # -mabi=32
  # -mno-branch-likely
  MIPS_CFLAGS: >-
    -mips32r2
    -mtune=24kc
    -mabi=32
    -msoft-float
    -mno-branch-likely

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build version'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - stable

permissions:
  contents: read

jobs:
  build:
    name: Build OpenWrt mipsel_24kc + UI + LuCI
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # 2. 选择 Nightly / Stable
      #
      # nightly:
      #   当前 Fork master
      #
      # stable:
      #   从 pymumu/smartdns 官方仓库获取 ReleaseXX tag
      #   并自动选择最新稳定版
      # ============================================================
      - name: Select SmartDNS Version
        id: version
        shell: bash
        run: |
          set -e

          BUILD_TYPE="${{ inputs.build_type }}"

          echo "=========================================="
          echo "Requested build type: $BUILD_TYPE"
          echo "=========================================="

          if [ "$BUILD_TYPE" = "stable" ]; then

            echo
            echo "=========================================="
            echo "Fetching official SmartDNS release tags"
            echo "=========================================="

            if git remote get-url upstream >/dev/null 2>&1; then
              git remote set-url upstream \
                https://github.com/pymumu/smartdns.git
            else
              git remote add upstream \
                https://github.com/pymumu/smartdns.git
            fi

            echo
            echo "Official upstream:"
            git remote get-url upstream

            echo
            echo "Fetching official tags..."

            git fetch \
              --force \
              --tags \
              upstream

            echo
            echo "=========================================="
            echo "Available official Release tags"
            echo "=========================================="

            git tag -l 'Release*' \
              | grep -E '^Release[0-9]+([.][0-9]+)*$' \
              | sort -V \
              || true

            echo
            echo "=========================================="
            echo "Finding latest stable release"
            echo "=========================================="

            LATEST_RELEASE=$(
              git tag -l 'Release*' \
                | grep -E '^Release[0-9]+([.][0-9]+)*$' \
                | sort -V \
                | tail -n 1 \
                || true
            )

            if [ -z "$LATEST_RELEASE" ]; then
              echo "ERROR: No official SmartDNS Release tag found."
              exit 1
            fi

            echo "Latest official release: $LATEST_RELEASE"

            echo
            echo "=========================================="
            echo "Checking out official stable release"
            echo "=========================================="

            git checkout --force "$LATEST_RELEASE"

            BUILD_LABEL="$LATEST_RELEASE"
            SOURCE_REF="$LATEST_RELEASE"
            SOURCE_DESCRIPTION="Official Stable Release $LATEST_RELEASE"

          elif [ "$BUILD_TYPE" = "nightly" ]; then

            echo
            echo "=========================================="
            echo "Using Fork master as Nightly source"
            echo "=========================================="

            BUILD_LABEL="nightly"
            SOURCE_REF="master"
            SOURCE_DESCRIPTION="Nightly build from Fork master"

          else

            echo "ERROR: Unknown build type: $BUILD_TYPE"
            exit 1

          fi

          PACKAGE_VERSION="$(date +"1.%Y.%m.%d-%H%M")"

          GIT_COMMIT="$(git rev-parse --short=7 HEAD)"
          GIT_COMMIT_FULL="$(git rev-parse HEAD)"

          echo
          echo "=========================================="
          echo "Selected SmartDNS Source"
          echo "=========================================="
          echo "Build Type      : $BUILD_TYPE"
          echo "Build Label     : $BUILD_LABEL"
          echo "Source          : $SOURCE_DESCRIPTION"
          echo "Source Ref      : $SOURCE_REF"
          echo "Package Version : $PACKAGE_VERSION"
          echo "Git Commit      : $GIT_COMMIT"
          echo "Full Commit     : $GIT_COMMIT_FULL"
          echo "=========================================="

          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "BUILD_LABEL=$BUILD_LABEL" >> "$GITHUB_ENV"
          echo "SOURCE_DESCRIPTION=$SOURCE_DESCRIPTION" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=$GIT_COMMIT" >> "$GITHUB_ENV"
          echo "GIT_COMMIT_FULL=$GIT_COMMIT_FULL" >> "$GITHUB_ENV"

          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "build_label=$BUILD_LABEL" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "git_commit=$GIT_COMMIT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3. Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # ============================================================
      # 4. Rust Nightly
      #
      # mipsel-unknown-linux-musl 没有预编译 std，
      # 使用 rust-src + build-std。
      # ============================================================
      - name: Setup Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # ============================================================
      # 5. Cargo Cache
      # ============================================================
      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugin/smartdns-ui/target
          key: ${{ runner.os }}-cargo-mipsel24kc-nightly-${{ hashFiles('plugin/smartdns-ui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mipsel24kc-nightly-
            ${{ runner.os }}-cargo-

      # ============================================================
      # 6. System Dependencies
      # ============================================================
      - name: Install System Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            libgtest-dev \
            dnsperf \
            jq \
            wget \
            unzip \
            tar \
            make \
            gcc \
            binutils

          # --------------------------------------------------------
          # 安装 Alpine apk.static
          # --------------------------------------------------------

          APK_FILE=$(wget -qO- \
            https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/ \
            | grep -oE 'apk-tools-static-[0-9][a-zA-Z0-9.-]*\.apk' \
            | head -n 1)

          wget \
            "https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/$APK_FILE" \
            -O /tmp/apk-tools-static.apk

          tar -zxf \
            /tmp/apk-tools-static.apk \
            -C /tmp

          sudo cp \
            /tmp/sbin/apk.static \
            /usr/local/bin/apk

          sudo cp \
            /tmp/sbin/apk.static \
            /usr/bin/apk

          sudo chmod +x \
            /usr/local/bin/apk \
            /usr/bin/apk

          apk --version

      # ============================================================
      # 7. Bindgen
      # ============================================================
      - name: Cache Bindgen CLI
        uses: actions/cache@v5
        id: cache-bindgen
        with:
          path: ~/.cargo/bin/bindgen
          key: ${{ runner.os }}-bindgen-cli-nightly-0.69.5

      - name: Install Bindgen CLI
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: |
          cargo install --force --locked bindgen-cli

      # ============================================================
      # 8. MIPSEL Toolchain + OpenSSL Cache
      #
      # 注意：
      # 这里升级 cache key。
      #
      # 原来的 OpenSSL 没有按 24kc 参数编译，
      # 绝对不能复用旧缓存。
      # ============================================================
      - name: Cache MIPSEL Toolchain and OpenSSL
        uses: actions/cache@v5
        id: cache-toolchain
        with:
          path: ~/toolchain
          key: ${{ runner.os }}-mipsel24kc-mips32r2-softfloat-openssl-3.5.4-v2

      # ============================================================
      # 9. Toolchain Directory
      # ============================================================
      - name: Link Toolchain Directory
        run: |
          set -e

          sudo mkdir -p /opt

          sudo ln -sfn \
            "$HOME/toolchain" \
            /opt/toolchain

      # ============================================================
      # 10. MIPSEL musl Cross Compiler
      # ============================================================
      - name: Setup MIPSEL Musl Cross Compiler
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e

          mkdir -p "$HOME/toolchain"

          URL="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/mipsel-linux-musl-cross.tgz"

          wget "$URL" \
            -O /tmp/mipsel-toolchain.tgz

          gzip -t /tmp/mipsel-toolchain.tgz

          tar \
            -C "$HOME/toolchain" \
            -xzf /tmp/mipsel-toolchain.tgz

          cd "$HOME/toolchain"

          ln -sfn \
            mipsel-linux-musl-cross \
            mipsel-unknown-linux-musl

          PREFIX_FROM="mipsel-linux-musl"
          PREFIX_TO="mipsel-unknown-linux-musl"

          for f in \
            "$HOME/toolchain/mipsel-linux-musl-cross/bin/${PREFIX_FROM}"-*; do

            if [ -f "$f" ]; then

              base=$(basename "$f")

              new_base=$(echo "$base" \
                | sed "s/$PREFIX_FROM/$PREFIX_TO/")

              ln -sfn "$f" \
                "$HOME/toolchain/mipsel-linux-musl-cross/bin/$new_base"

            fi
          done

          ln -sfn \
            "${PREFIX_FROM}-objdump" \
            "$HOME/toolchain/mipsel-linux-musl-cross/bin/objdump"

      # ============================================================
      # 11. Verify Toolchain
      # ============================================================
      - name: Verify MIPSEL Toolchain
        run: |
          set -e

          CC="/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-gcc"

          echo "=========================================="
          echo "Cross compiler"
          echo "=========================================="

          "$CC" --version

          echo
          echo "=========================================="
          echo "Target information"
          echo "=========================================="

          echo "OpenWrt arch : $OPENWRT_ARCH"
          echo "CPU          : $TARGET_CPU"
          echo "ISA          : $TARGET_ISA"
          echo "Endian       : little"
          echo "ABI          : o32"
          echo "Float ABI    : soft-float"
          echo "CFLAGS       : $MIPS_CFLAGS"

          echo
          echo "=========================================="
          echo "Compiler predefined macros"
          echo "=========================================="

          echo | "$CC" \
            $MIPS_CFLAGS \
            -dM \
            -E \
            - \
            | grep -E \
              '__MIPSEL|__mips|__mips_isa_rev|__mips_soft_float|_MIPS_SIM' \
            | sort \
            || true

          echo
          echo "=========================================="
          echo "Compile test"
          echo "=========================================="

          cat > /tmp/mips-test.c <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          "$CC" \
            $MIPS_CFLAGS \
            /tmp/mips-test.c \
            -o /tmp/mips-test

          TOOLCHAIN_OBJDUMP="/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-objdump"

          "$TOOLCHAIN_OBJDUMP" \
            -f \
            /tmp/mips-test

          "$TOOLCHAIN_OBJDUMP" \
            -p \
            /tmp/mips-test \
            | head -n 80 \
            || true

      # ============================================================
      # 12. Compile OpenSSL for OpenWrt mipsel_24kc
      #
      # 关键：
      #
      # CFLAGS:
      #   -mips32r2
      #   -mtune=24kc
      #   -mabi=32
      #   -msoft-float
      #   -mno-branch-likely
      #
      # ============================================================
      - name: Compile OpenSSL for OpenWrt mipsel_24kc
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e

          wget -q \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz \
            -O /tmp/openssl-3.5.4.tar.gz

          rm -rf /tmp/build-openssl

          mkdir -p /tmp/build-openssl

          cd /tmp/build-openssl

          tar -xzf \
            /tmp/openssl-3.5.4.tar.gz

          cd openssl-3.5.4

          CC="/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-gcc"

          SYSROOT=$($CC --print-sysroot)

          echo "=========================================="
          echo "Building OpenSSL"
          echo "=========================================="
          echo "Target  : OpenWrt mipsel_24kc"
          echo "CPU     : 24kc"
          echo "ISA     : MIPS32r2"
          echo "Endian  : little"
          echo "ABI     : o32"
          echo "Float   : soft"
          echo "SYSROOT : $SYSROOT"
          echo "CFLAGS  : $MIPS_CFLAGS -Os"
          echo "=========================================="

          export CC="$CC"
          export CFLAGS="$MIPS_CFLAGS -Os"

          ./Configure \
            linux-generic32 \
            --prefix="$SYSROOT" \
            no-shared \
            no-tests \
            no-apps \
            no-argon2 \
            no-aria \
            no-async \
            no-bf \
            no-blake2 \
            no-camellia \
            no-cmp \
            no-cms \
            no-comp \
            no-des \
            no-dh \
            no-dsa \
            no-ec2m \
            no-engine \
            no-gost \
            no-http \
            no-idea \
            no-legacy \
            no-md4 \
            no-mdc2 \
            no-multiblock \
            no-nextprotoneg \
            no-ocb \
            no-ocsp \
            no-rc2 \
            no-rc4 \
            no-rmd160 \
            no-scrypt \
            no-seed \
            no-siphash \
            no-siv \
            no-sm2 \
            no-sm3 \
            no-sm4 \
            no-srp \
            no-srtp \
            no-ts \
            no-whirlpool \
            no-ssl-trace \
            no-ssl \
            no-ssl3

          make -j"$(nproc)"

          sudo make install_sw

      # ============================================================
      # 13. Configure Rust
      #
      # Rust 内置 mipsel-unknown-linux-musl：
      #
      # CPU      = mips32r2
      # Endian   = little
      # ABI      = O32
      # features = +mips32r2,+soft-float
      #
      # 同时把 GCC linker 固定到 OpenWrt 24kc 参数。
      # ============================================================
      - name: Configure Rust for OpenWrt mipsel_24kc
        run: |
          set -e

          mkdir -p "$HOME/.cargo"

          cat > "$HOME/.cargo/config.toml" <<'EOF'
          [target.mipsel-unknown-linux-musl]
          linker = "/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-gcc"

          rustflags = [
              "-C", "target-cpu=mips32r2",
              "-C", "target-feature=+mips32r2,+soft-float",
              "-C", "link-arg=-mips32r2",
              "-C", "link-arg=-mtune=24kc",
              "-C", "link-arg=-mabi=32",
              "-C", "link-arg=-msoft-float",
              "-C", "link-arg=-mno-branch-likely"
          ]
          EOF

          echo "=========================================="
          echo "Rust"
          echo "=========================================="

          rustc --version
          cargo --version

          echo
          echo "=========================================="
          echo "Installed Rust components"
          echo "=========================================="

          rustup component list --installed

          echo
          echo "=========================================="
          echo "Rust target specification"
          echo "=========================================="

          rustc \
            +nightly \
            -Z unstable-options \
            --print target-spec-json \
            --target "$RUST_TARGET" \
            | grep -E \
              '"arch"|"cpu"|"data-layout"|"features"|"llvm-target"' \
            || true

          echo
          echo "=========================================="
          echo "Cargo config"
          echo "=========================================="

          cat "$HOME/.cargo/config.toml"

      # ============================================================
      # 14. Patch SmartDNS UI
      #
      # 使用 build-std 确保 std/core 也使用同一个：
      #
      # mips32r2
      # soft-float
      #
      # ============================================================
      - name: Patch SmartDNS UI for MIPS32r2 build-std
        run: |
          set -e

          MAKEFILE="plugin/smartdns-ui/Makefile"

          echo "=========================================="
          echo "Original Cargo commands"
          echo "=========================================="

          grep -n \
            "cargo.*build" \
            "$MAKEFILE" \
            || true

          # 防止重复 patch
          if ! grep -q \
            'cargo build -Z build-std=std,panic_abort' \
            "$MAKEFILE"; then

            sed -i \
              's/cargo build/cargo build -Z build-std=std,panic_abort/g' \
              "$MAKEFILE"

          fi

          echo
          echo "=========================================="
          echo "Patched Cargo commands"
          echo "=========================================="

          grep -n \
            "cargo.*build" \
            "$MAKEFILE" \
            || true

          if ! grep -q \
            'cargo build -Z build-std=std,panic_abort' \
            "$MAKEFILE"; then

            echo "ERROR: Failed to patch smartdns-ui Makefile."
            exit 1

          fi

      # ============================================================
      # 15. Build SmartDNS
      #
      # SmartDNS C 主程序：
      #
      #   MIPS32r2
      #   24Kc tuning
      #   little endian
      #   O32
      #   soft-float
      #
      # Rust Dashboard：
      #
      #   mipsel-unknown-linux-musl
      #   MIPS32r2
      #   soft-float
      #
      # ============================================================
      - name: Build SmartDNS OpenWrt mipsel_24kc with Dashboard UI
        run: |
          set -e

          export RELEASE_VERSION="$PACKAGE_VERSION"

          export STATIC=yes

          export CC="/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-gcc"

          export AR="/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-ar"

          export RANLIB="/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-ranlib"

          export STRIP="/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-strip"

          export OBJDUMP="/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-objdump"

          export PATH="$(dirname "$CC"):$PATH"

          # --------------------------------------------------------
          # OpenWrt mipsel_24kc CPU flags
          # --------------------------------------------------------

          export CFLAGS="-DFEATURE_CHECK_EDNS \
          -mips32r2 \
          -mtune=24kc \
          -mabi=32 \
          -msoft-float \
          -mno-branch-likely \
          -O2 \
          -g \
          -Wall \
          -Wstrict-prototypes \
          -fno-omit-frame-pointer \
          -Wstrict-aliasing \
          -funwind-tables \
          -Wmissing-prototypes \
          -Wshadow \
          -Wextra \
          -Wno-unused-parameter \
          -Wno-implicit-fallthrough"

          export CXXFLAGS="$CFLAGS"

          # Rust target 本身已经是：
          #
          # MIPS32r2
          # little endian
          # soft-float
          # O32
          #
          # ~/.cargo/config.toml 另外给 linker
          # 指定了 24kc 参数。

          export CARGO_BUILD_TARGET="$RUST_TARGET"

          echo "=========================================="
          echo "Building SmartDNS"
          echo "=========================================="
          echo "Build Type      : $BUILD_TYPE"
          echo "Build Label     : $BUILD_LABEL"
          echo "Source Ref      : $SOURCE_REF"
          echo "Package Version : $RELEASE_VERSION"
          echo "Git Commit      : $GIT_COMMIT"
          echo
          echo "OpenWrt Arch    : $OPENWRT_ARCH"
          echo "CPU             : $TARGET_CPU"
          echo "ISA             : $TARGET_ISA"
          echo "Endian          : little"
          echo "ABI             : o32"
          echo "Float ABI       : soft-float"
          echo "Rust Target     : $RUST_TARGET"
          echo
          echo "CFLAGS:"
          echo "$CFLAGS"
          echo "=========================================="

          "$CC" --version

          rustc --version
          cargo --version

          echo
          echo "=========================================="
          echo "Compiler macros"
          echo "=========================================="

          echo | "$CC" \
            -mips32r2 \
            -mtune=24kc \
            -mabi=32 \
            -msoft-float \
            -mno-branch-likely \
            -dM \
            -E \
            - \
            | grep -E \
              '__MIPSEL|__mips|__mips_isa_rev|__mips_soft_float|_MIPS_SIM' \
            | sort \
            || true

          echo
          echo "=========================================="
          echo "Final smartdns-ui Cargo command"
          echo "=========================================="

          grep -n \
            "cargo.*build" \
            plugin/smartdns-ui/Makefile \
            || true

          chmod +x package/build-pkg.sh

          ./package/build-pkg.sh \
            --platform openwrt \
            --arch all \
            --filearch=mipsel_24kc-openwrt-all \
            --ver "$RELEASE_VERSION" \
            --outputdir "$GITHUB_WORKSPACE" \
            --with-ui

          echo
          echo "=========================================="
          echo "SmartDNS build completed"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "smartdns_ui.so" \
              -o \
              -name "smartdns" \
            \) \
            -print

      # ============================================================
      # 16. Inspect Generated Binaries
      #
      # 这里非常重要。
      #
      # 编译完成后检查 ELF，
      # 以后如果还有 SIGILL 可以直接看 Actions 日志。
      # ============================================================
      - name: Inspect MIPS32r2 Binaries
        run: |
          set -e

          OBJDUMP="/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-objdump"

          echo "=========================================="
          echo "Searching SmartDNS binaries"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( \
              -name "smartdns" \
              -o \
              -name "smartdns_ui.so" \
            \) \
            -print

          echo
          echo "=========================================="
          echo "ELF inspection"
          echo "=========================================="

          while IFS= read -r FILE; do

            echo
            echo "------------------------------------------"
            echo "$FILE"
            echo "------------------------------------------"

            "$OBJDUMP" \
              -f \
              "$FILE" \
              2>/dev/null \
              || true

            "$OBJDUMP" \
              -p \
              "$FILE" \
              2>/dev/null \
              | head -n 100 \
              || true

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( \
                -name "smartdns" \
                -o \
                -name "smartdns_ui.so" \
              \)
          )

      # ============================================================
      # 17. Build LuCI APP
      #
      # LuCI 本身是 all 架构。
      # ============================================================
      - name: Build LuCI App APK
        run: |
          set -e

          echo "=========================================="
          echo "Building LuCI App"
          echo "=========================================="
          echo "Build Type      : $BUILD_TYPE"
          echo "Build Label     : $BUILD_LABEL"
          echo "Package Version : $PACKAGE_VERSION"
          echo "=========================================="

          chmod +x package/build-pkg.sh

          ./package/build-pkg.sh \
            --platform luci \
            --arch all \
            --filearch=all-luci-all \
            --ver "$PACKAGE_VERSION" \
            --outputdir "$GITHUB_WORKSPACE" \
            --only-package

          echo
          echo "=========================================="
          echo "LuCI build completed"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -type f \
            -name "luci-app-smartdns*.apk" \
            -print

      # ============================================================
      # 18. Collect APKs
      # ============================================================
      - name: Collect APKs and Build Information
        run: |
          set -e

          mkdir -p release-assets

          echo "=========================================="
          echo "Searching SmartDNS APK"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "smartdns.*.mipsel_24kc-openwrt-all.apk" \
            -exec cp -v {} release-assets/ \;

          echo
          echo "=========================================="
          echo "Searching LuCI APK"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "luci-app-smartdns.*.all-luci-all.apk" \
            -exec cp -v {} release-assets/ \;

          cat > release-assets/BUILD-INFO.txt <<EOF
          SmartDNS OpenWrt mipsel_24kc Build
          ========================================

          Build Type      : $BUILD_TYPE
          Build Label     : $BUILD_LABEL
          Source          : $SOURCE_DESCRIPTION
          Source Ref      : $SOURCE_REF

          Package Version : $PACKAGE_VERSION

          Git Commit      : $GIT_COMMIT
          Full Git Commit : $GIT_COMMIT_FULL

          OpenWrt Arch    : mipsel_24kc
          CPU             : MIPS 24Kc
          ISA             : MIPS32r2
          Endian          : Little Endian
          ABI             : O32
          Float ABI       : Soft Float

          C CPU Flags:
          -mips32r2
          -mtune=24kc
          -mabi=32
          -msoft-float
          -mno-branch-likely

          Rust Target:
          mipsel-unknown-linux-musl

          Rust CPU:
          mips32r2

          Rust Features:
          +mips32r2,+soft-float

          Dashboard UI    : YES
          LuCI APP        : YES

          Rust build-std  : YES

          Package Format  : OpenWrt APK

          ========================================
          EOF

          echo
          echo "=========================================="
          echo "BUILD INFORMATION"
          echo "=========================================="

          cat release-assets/BUILD-INFO.txt

          echo
          echo "=========================================="
          echo "Generated files"
          echo "=========================================="

          ls -lh release-assets/

          SMARTDNS_COUNT=$(find release-assets \
            -maxdepth 1 \
            -type f \
            -name "smartdns.*.mipsel_24kc-openwrt-all.apk" \
            | wc -l)

          LUCI_COUNT=$(find release-assets \
            -maxdepth 1 \
            -type f \
            -name "luci-app-smartdns.*.all-luci-all.apk" \
            | wc -l)

          echo
          echo "SmartDNS APK count: $SMARTDNS_COUNT"
          echo "LuCI APK count:     $LUCI_COUNT"

          if [ "$SMARTDNS_COUNT" -lt 1 ]; then
            echo "ERROR: SmartDNS mipsel_24kc APK was not generated."
            exit 1
          fi

          if [ "$LUCI_COUNT" -lt 1 ]; then
            echo "ERROR: LuCI APP APK was not generated."
            exit 1
          fi

      # ============================================================
      # 19. Upload Artifact
      #
      # Nightly:
      #
      # smartdns-nightly-openwrt-mipsel_24kc-ui-luci-xxxxxxx
      #
      # Stable:
      #
      # smartdns-Release48.4-openwrt-mipsel_24kc-ui-luci-xxxxxxx
      # ============================================================
      - name: Upload SmartDNS + LuCI APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: smartdns-${{ steps.version.outputs.build_label }}-openwrt-mipsel_24kc-ui-luci-${{ steps.version.outputs.git_commit }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
