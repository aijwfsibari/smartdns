name: Build SmartDNS MIPSEL OpenWrt APK with UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MIPSEL OpenWrt APK + UI
    runs-on: ubuntu-22.04

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 2. Node.js
      # SmartDNS WebUI 编译需要
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # ------------------------------------------------------------
      # 3. Rust
      # smartdns_ui.so 使用 Rust 编译
      # ------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ------------------------------------------------------------
      # 4. Cargo 缓存
      # ------------------------------------------------------------
      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugin/smartdns-ui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('plugin/smartdns-ui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ------------------------------------------------------------
      # 5. 系统依赖
      # ------------------------------------------------------------
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtest-dev \
            dnsperf \
            jq \
            wget \
            unzip \
            tar \
            make \
            gcc

          # 安装 Alpine apk.static
          APK_FILE=$(wget -qO- \
            https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/ \
            | grep -oE 'apk-tools-static-[0-9][a-zA-Z0-9.-]*\.apk' \
            | head -n 1)

          wget \
            "https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/$APK_FILE" \
            -O /tmp/apk-tools-static.apk

          tar -zxf /tmp/apk-tools-static.apk -C /tmp

          sudo cp /tmp/sbin/apk.static /usr/local/bin/apk
          sudo cp /tmp/sbin/apk.static /usr/bin/apk
          sudo chmod +x /usr/local/bin/apk /usr/bin/apk

          apk --version

      # ------------------------------------------------------------
      # 6. bindgen
      # smartdns-ui Makefile 需要
      # ------------------------------------------------------------
      - name: Cache Bindgen CLI
        uses: actions/cache@v5
        id: cache-bindgen
        with:
          path: ~/.cargo/bin/bindgen
          key: ${{ runner.os }}-bindgen-cli-0.69.5

      - name: Install Bindgen CLI
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: |
          cargo install --force --locked bindgen-cli

      # ------------------------------------------------------------
      # 7. MIPSEL toolchain + OpenSSL 缓存
      # ------------------------------------------------------------
      - name: Cache MIPSEL Toolchain and OpenSSL
        uses: actions/cache@v5
        id: cache-toolchain
        with:
          path: ~/toolchain
          key: ${{ runner.os }}-mipsel-toolchain-openssl-3.5.4-v1

      - name: Link Toolchain Directory
        run: |
          sudo mkdir -p /opt
          sudo ln -sfn "$HOME/toolchain" /opt/toolchain

      # ------------------------------------------------------------
      # 8. 只下载 MIPSEL musl toolchain
      # ------------------------------------------------------------
      - name: Setup MIPSEL Musl Cross Compiler
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e

          mkdir -p "$HOME/toolchain"

          URL="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/mipsel-linux-musl-cross.tgz"

          wget "$URL" -O /tmp/mipsel-toolchain.tgz

          gzip -t /tmp/mipsel-toolchain.tgz

          tar -C "$HOME/toolchain" \
            -xzf /tmp/mipsel-toolchain.tgz

          cd "$HOME/toolchain"

          ln -s \
            mipsel-linux-musl-cross \
            mipsel-unknown-linux-musl

          # 官方 workflow 的处理方式：
          # 为工具链命令建立 unknown-linux-musl 名称的软链接
          PREFIX_FROM="mipsel-linux-musl"
          PREFIX_TO="mipsel-unknown-linux-musl"

          for f in \
            "$HOME/toolchain/mipsel-linux-musl-cross/bin/${PREFIX_FROM}"-*; do

            if [ -f "$f" ]; then
              base=$(basename "$f")
              new_base=$(echo "$base" | sed "s/$PREFIX_FROM/$PREFIX_TO/")

              ln -s "$f" \
                "$HOME/toolchain/mipsel-linux-musl-cross/bin/$new_base"
            fi
          done

          ln -s \
            "${PREFIX_FROM}-objdump" \
            "$HOME/toolchain/mipsel-linux-musl-cross/bin/objdump"

      # ------------------------------------------------------------
      # 9. 只编译 MIPSEL OpenSSL
      # ------------------------------------------------------------
      - name: Compile OpenSSL for MIPSEL
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e

          wget -q \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz \
            -O /tmp/openssl-3.5.4.tar.gz

          mkdir -p /tmp/build-openssl
          cd /tmp/build-openssl

          tar -xzf /tmp/openssl-3.5.4.tar.gz
          cd openssl-3.5.4

          CC="/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-gcc"

          SYSROOT=$($CC --print-sysroot)

          CC="$CC" ./Configure linux-generic32 \
            --prefix="$SYSROOT" \
            no-shared \
            no-tests \
            no-apps \
            no-argon2 \
            no-aria \
            no-async \
            no-bf \
            no-blake2 \
            no-camellia \
            no-cmp \
            no-cms \
            no-comp \
            no-des \
            no-dh \
            no-dsa \
            no-ec2m \
            no-engine \
            no-gost \
            no-http \
            no-idea \
            no-legacy \
            no-md4 \
            no-mdc2 \
            no-multiblock \
            no-nextprotoneg \
            no-ocb \
            no-ocsp \
            no-rc2 \
            no-rc4 \
            no-rmd160 \
            no-scrypt \
            no-seed \
            no-siphash \
            no-siv \
            no-sm2 \
            no-sm3 \
            no-sm4 \
            no-srp \
            no-srtp \
            no-ts \
            no-whirlpool \
            no-ssl-trace \
            no-ssl \
            no-ssl3 \
            -Os

          make -j$(nproc)
          sudo make install_sw

      # ------------------------------------------------------------
      # 10. 编译 SmartDNS
      #
      # 只构建：
      #   MIPSEL
      #   OpenWrt
      #   UI
      #
      # 相当于官方：
      #   build mipsel openwrt nobuild ui
      # ------------------------------------------------------------
      - name: Build SmartDNS MIPSEL OpenWrt with UI
        run: |
          set -e

          export RELEASE_VERSION="$(date +"1.%Y.%m.%d-%H%M")"

          export STATIC=yes

          export CFLAGS="-DFEATURE_CHECK_EDNS \
          -O2 \
          -g \
          -Wall \
          -Wstrict-prototypes \
          -fno-omit-frame-pointer \
          -Wstrict-aliasing \
          -funwind-tables \
          -Wmissing-prototypes \
          -Wshadow \
          -Wextra \
          -Wno-unused-parameter \
          -Wno-implicit-fallthrough"

          export CC=/opt/toolchain/mipsel-unknown-linux-musl/bin/mipsel-unknown-linux-musl-gcc

          # 保证 gcc / strip / objdump 都使用 MIPSEL 工具链
          export PATH="$(dirname "$CC"):$PATH"

          chmod +x package/build-pkg.sh

          ./package/build-pkg.sh \
            --platform openwrt \
            --arch all \
            --filearch=mipsel-openwrt-all \
            --ver "$RELEASE_VERSION" \
            --outputdir "$GITHUB_WORKSPACE" \
            --with-ui

          echo
          echo "=========================================="
          echo "Build completed"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            \( -name "*.apk" -o -name "smartdns_ui.so" \) \
            -print

      # ------------------------------------------------------------
      # 11. 只收集 APK
      # ------------------------------------------------------------
      - name: Collect APK
        run: |
          set -e

          mkdir -p release-assets

          find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -name "*.apk" \
            -exec cp -v {} release-assets/ \;

          echo
          echo "=========================================="
          echo "Generated APK files:"
          echo "=========================================="

          ls -lh release-assets/

          if ! find release-assets \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | grep -q .; then

            echo "ERROR: No APK package was generated."
            exit 1
          fi

      # ------------------------------------------------------------
      # 12. 上传到 GitHub Actions Artifacts
      #
      # 不创建 Release / Nightly
      # 直接在本次 Actions 页面下载
      # ------------------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: smartdns-mipsel-openwrt-ui-apk
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30
